openapi: 3.0.3
info:
  title: Kanban CRM/ERP API
  version: 1.2.0
  description: |
    Especificacao atualizada em 14/03/2026 a partir do codigo das Edge Functions.

    API externa (com API key):
    - /api-crm/*
    - /api-erp/*

    Funcoes auxiliares internas:
    - /sync-chatwoot-contact
    - /webhook-processor

    Autorizacao interna (Sprint 0):
    - sync-chatwoot-contact: x-internal-token OU JWT admin
    - webhook-processor: x-internal-token

    Convencoes de erro relevantes:
    - Recurso nao encontrado: 404
    - Metodo nao suportado em rota valida: 405

servers:
  - url: https://your-project.supabase.co/functions/v1
    description: Production (Supabase Cloud)
  - url: http://localhost:54321/functions/v1
    description: Local Development

security:
  - ApiKeyAuth: []

tags:
  - name: CRM - Deals
    description: Operacoes de deals
  - name: CRM - Contacts
    description: Operacoes de contatos
  - name: CRM - Pipelines
    description: Operacoes de pipelines
  - name: ERP - Clients
    description: Operacoes de clientes
  - name: ERP - Contracts
    description: Operacoes de contratos
  - name: ERP - Receivables
    description: Operacoes de contas a receber
  - name: Internal
    description: Funcoes auxiliares internas

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'API key no formato `Authorization: Bearer sk_live_...`'
    SupabaseUserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de usuario autenticado no Supabase (admin para rotas internas administrativas).
    InternalTokenAuth:
      type: apiKey
      in: header
      name: x-internal-token
      description: Token interno configurado na variavel `INTERNAL_FUNCTION_TOKEN`.

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Unauthorized

    GenericObject:
      type: object
      additionalProperties: true

    Deal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        contact_id:
          type: integer
          nullable: true
        deal_value_negotiated:
          type: number
        priority:
          type: string
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        contacts:
          $ref: '#/components/schemas/GenericObject'
        crm_stages:
          $ref: '#/components/schemas/GenericObject'
      additionalProperties: true

    Contact:
      type: object
      properties:
        id:
          type: integer
        chatwoot_id:
          type: integer
          nullable: true
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        profile_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: true

    Pipeline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        chatwoot_inbox_id:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: true

    Client:
      type: object
      properties:
        id:
          type: integer
        contact_id:
          type: integer
          nullable: true
        full_name:
          type: string
        cpf:
          type: string
        source:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        contacts:
          $ref: '#/components/schemas/GenericObject'
      additionalProperties: true

    Contract:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        client_id:
          type: integer
        contract_type_id:
          type: integer
        contract_number:
          type: string
        status:
          type: string
        total_value:
          type: number
        final_value:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        clients:
          $ref: '#/components/schemas/GenericObject'
        companies:
          $ref: '#/components/schemas/GenericObject'
        contract_types:
          $ref: '#/components/schemas/GenericObject'
      additionalProperties: true

    Receivable:
      type: object
      properties:
        id:
          type: integer
        contract_id:
          type: integer
        client_id:
          type: integer
        installment_number:
          type: integer
        due_date:
          type: string
          format: date
        amount:
          type: number
        status:
          type: string
        paid_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        clients:
          $ref: '#/components/schemas/GenericObject'
        contracts:
          $ref: '#/components/schemas/GenericObject'
      additionalProperties: true

paths:
  /api-crm/deals:
    get:
      tags:
        - CRM - Deals
      summary: Listar deals
      description: Retorna deals nao arquivados (`is_archived = false`).
      operationId: listDeals
      parameters:
        - name: pipeline_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de deals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deal'
                  total:
                    type: integer
                    description: Quantidade retornada na pagina atual
        '401':
          description: API key ausente/invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissao (`crm:read`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - CRM - Deals
      summary: Criar deal
      description: |
        Cria um deal em `crm_deals` com o payload recebido.
        O backend nao aplica validacao de schema alem das constraints do banco.
      operationId: createDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Deal criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deal'
                  message:
                    type: string
                    example: Deal created successfully
        '401':
          description: API key ausente/invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissao (`crm:write`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api-crm/deals/{id}:
    get:
      tags:
        - CRM - Deals
      summary: Buscar deal por ID
      operationId: getDeal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deal encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deal'
        '401':
          description: API key ausente/invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissao (`crm:read`)
          content:
            application/json:
              schema:
