  /sync-chatwoot-contact:
    post:
      tags:
        - Internal
      summary: Sincronizar contato com Chatwoot
      description: |
        Sincroniza um contato de `crm_contacts` com Chatwoot e salva `chatwoot_id`.
        Esta funcao nao usa API key de integracao (`sk_live_...`).
        Requer `x-internal-token` ou JWT de usuario admin.
      operationId: syncChatwootContact
      security:
        - InternalTokenAuth: []
        - SupabaseUserAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contact_id
              properties:
                contact_id:
                  type: integer
      responses:
        '200':
          description: Contato sincronizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  chatwoot_id:
                    type: integer
                  message:
                    type: string
                    example: Contact synced successfully
        '400':
          description: Erro de validacao/integracao
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Usuario autenticado sem privilegio admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Forbidden: admin required
        '404':
          description: Contato nao encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Contact not found

  /webhook-processor:
    post:
      tags:
        - Internal
      summary: Processar fila de webhooks
      description: |
        Processa ate 10 eventos pendentes da tabela `webhook_queue`.
        Requer `x-internal-token`.
      operationId: processWebhookQueue
      security:
        - InternalTokenAuth: []
      responses:
        '200':
          description: Fila processada
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          description: Token interno ausente/invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
